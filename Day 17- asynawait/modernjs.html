<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //template string

        var a="John"

        //old way
        console.log("my name is ", a)

        //new way
        console.log(`my name is ${a}`)

        //arrow function

        //old way
        function xyz(){
            console.log("i am old function")
        }
        xyz()

        ///new way

        var abc=()=>{
            console.log("i am arrow function")
        }
        abc()





    </script>
</body>
</html>
