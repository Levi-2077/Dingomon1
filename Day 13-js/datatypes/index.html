<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        //1. string - "anything in between quotes" - simple form of text

        var city = "Texas"

        console.log(city)

        console.log("The city name is", city)

        //typeof(value) - helps the check the datatype

        console.log(typeof(city))

        //2. number

        var age = 33

        var height = 5.11

        var temp = -21

        console.log(typeof(age))
        console.log(typeof(height))
        console.log(typeof(temp))

        //3. boolean

        var isloggedin = true

        var canwatchvideo = false

        var netflixsubscribe = "true"

        console.log(typeof(canwatchvideo))
        console.log(typeof(netflixsubscribe))


        //undefined - value is not assigned

        var x

        console.log(typeof(x))

        //null - nothing

        var discount = null

        console.log(typeof(discount))

        //bug in javascript - null data type output is object



    </script>
</body>
</html>
