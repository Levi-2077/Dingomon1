<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>

        //operators

        //1. arithmetic operator - +, -, /, *, %

        var x=10
        var y=7
        console.log(x+y)
        console.log(x-y)
        console.log(x*y)
        console.log(x/y)
        console.log(x%y)


        //2. Assignment - value to be assigned

        var a = 10
        console.log(a+=5)
        console.log(a-=5)
        console.log(a/=5)
        console.log(a*=5)

        //3. comparison operator- <,>,<=,>=,==,===
        //output=boolean

        var p=20
        var q=15
        console.log(p<q)
        console.log(p>q)

        var b=25
        var c=25
        console.log(b<=c)
        console.log(b>=c)

        var height1=171
        var height2="171"
        console.log(height1==height2) //only checks value
        console.log(height1===height2) //checks data type and value





    </script>
    






</body>
</html>
