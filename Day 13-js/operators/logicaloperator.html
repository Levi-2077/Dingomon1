<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //logical operator - and, or, not

        //1. and - && : if both condition true, output is true

        var ismember= false
        var totalbill=1500
        console.log("discount applicable-", ismember && totalbill>1000)

        var firsttimeuser=true
        var bill=500
        console.log("first time discount-", firsttimeuser && bill>=500)


        //2. or - || : if one condition true, output true

        var loggedin=true
        var canwatch=false
        console.log(loggedin || canwatch)


        //3. not - ! : opposite value

        let netflixsubs=false
        console.log(!netflixsubs)





    </script>
</body>
</html>
