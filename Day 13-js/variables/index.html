<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        //keywords-codewords for js

        //syntax-variabletype(keyword) variablename=value

        //1. var keyword- js gets to know developer wants to create a variable

        var username="Anthony"

        console.log(username)

        var age = 12

        console.log(age)
        //disadv- var allows the usage of same variablename for multiple data

        //2. let keyword

        let email="abc@gmail.com"
        console.log(email)

        let password=1234


        console.log(password)
        //does not allow multiple usage for same variablename

        let name="Tony"
        name="Bob"
        console.log(name)
        //if variable type is not mentioned, it takes var by default. hence having its disadv

        //3. const keyword - fixed. cannot change
        
        const appname = "whatsapp"
        console.log(appname)
        //data is stored in memory


    </script>
</body>
</html>
