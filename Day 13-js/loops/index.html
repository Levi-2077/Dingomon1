<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //for loop (starting point; ending/condition ; ++ or --)

        //print numbers from 1 to 10
        for(let i=1; i<=10; i++){
            console.log("the value is:", i)
        }

        for(let y=10; y>=1; y--){
            console.log("the value is:", y)
        }

        //while loop ( while(condition) )

        let count=1
        while(count<=5){
            console.log("I'm while loop")
            count++
        }


        //do while loop

        let number=7
        do{
            console.log("I'm do while")
        }while(number<5)






    </script>
</body>
</html>
