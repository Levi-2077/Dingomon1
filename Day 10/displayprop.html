<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            color: red;
        }

        div .ex1{
            display: none;
        }

        div .ex2{
            display: block;
            background-color: bisque;
        }

        div .ex3{
            display: inline;
            background-color: blueviolet;
        }
    </style>
</head>
<body>
    <div>
        Display: None, means to show nothing/ it would just hide the content
        <p class="ex1">Hello display none</p>
    </div>

    <div>
        display : block, it is similar to div container cz it takes 100% width of space
        <p class="ex2">Hello display block</p>
    </div>

    <div>
        display : Inline, it is similar to span tag cz it only takes required amount of width
        <p class="ex3">Hello display inline</p>
    </div>
</body>
</html>
