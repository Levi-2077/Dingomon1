<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .banner{
            border: 1px solid black;
            height: 700px;
            text-align: center;
            color: aliceblue;
            text-shadow: 0 4px 6px blue;
            font-size: 30px;

            /* background property */

            background-color: aqua;

            /* background-image: url('address of image/name of image'); */

            background-image: url('https://images.pexels.com/photos/28385187/pexels-photo-28385187.jpeg');
            background-position: center;
            background-size: cover;
        }
    </style>
</head>
<body>
    <div class="banner">
        <h1>Cafe . Coffee</h1>
    </div>
</body>
</html>
