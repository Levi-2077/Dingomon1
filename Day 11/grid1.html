<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .items{
            display: grid;
            /* grid-template-columns: repeat(no. of colomns(max no. of colomns is 12), size of each colomn); */
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            background-color: skyblue;
            padding: 20px;
            gap: 25px;
        }

        .box{
            border: 1px solid black;
            background-color: palegreen;
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="items">

        <div class="box">Cake</div>
        <div class="box">$25</div>
        <div class="box">Cookie</div>
        <div class="box">$10</div>
        <div class="box">Pastry</div>
        <div class="box">$15</div>


    </div>
</body>
</html>
